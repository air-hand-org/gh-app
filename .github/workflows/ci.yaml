name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
    types: [checks_requested]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: $/.github/workflows/_ci.yaml
    permissions:
      contents: read
      security-events: write
    secrets: inherit

  check-result:
    needs: ci
    runs-on: ubuntu-slim
    if: >-
      always() &&
      needs.ci.result != 'success'
    steps:
      - name: exit with failure
        run: exit 1
