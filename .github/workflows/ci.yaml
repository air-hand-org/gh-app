name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: $/.github/workflows/_ci.yaml
    permissions:
      contents: read
      security-events: write
    secrets: inherit

  check-result:
    needs: ci
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Require successful CI
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = success
